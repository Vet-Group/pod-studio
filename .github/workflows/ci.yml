name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, unit and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      # The test guard only accepts local services; these match ops/local/docker-compose.yml.
      TEST_SKIP_SERVICES_UP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Start Postgres and MinIO
        run: docker compose -f ops/local/docker-compose.yml up -d --wait

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit and integration tests
        run: pnpm test

      - name: Worker contract examples and generated types
        working-directory: packages/contracts
        run: npm ci && npm run check

      - name: Database migration consistency
        run: pnpm db:check

      - name: Task catalog
        run: node tasks/validate-tasks.mjs

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm test:e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  image:
    name: Production image and stack smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -f ops/docker/Dockerfile -t pod-studio-web:ci .

      - name: Throwaway production env
        run: |
          umask 077
          {
            echo "APP_DOMAIN=localhost:18443"
            echo "ACME_EMAIL=ci@example.com"
            echo "APP_IMAGE=pod-studio-web:ci"
            echo "POSTGRES_USER=pod"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "POSTGRES_DB=pod_studio"
            echo "MINIO_ROOT_USER=pod-root"
            echo "MINIO_ROOT_PASSWORD=$(openssl rand -hex 16)"
            echo "S3_ACCESS_KEY_ID=pod-app"
            echo "S3_SECRET_ACCESS_KEY=$(openssl rand -hex 16)"
            echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)"
            echo "SHOPIFY_ENCRYPTION_KEYS=v1:$(openssl rand -base64 32)"
            echo "SHOPIFY_ENCRYPTION_ACTIVE_VERSION=v1"
            echo "HTTP_PORT=18080"
            echo "HTTPS_PORT=18443"
          } > "$RUNNER_TEMP/prod.env"

      - name: Start the production stack
        run: docker compose -p pod-ci -f ops/prod/docker-compose.yml --env-file "$RUNNER_TEMP/prod.env" up -d --wait

      - name: Smoke test
        run: SMOKE_INSECURE=1 sh ops/prod/smoke.sh https://localhost:18443 pod-studio

      - name: Backup and restore drill
        env:
          COMPOSE_PROJECT: pod-ci
        run: |
          export ENV_FILE="$RUNNER_TEMP/prod.env"
          sh ops/prod/backup.sh "$RUNNER_TEMP/backups"
          sh ops/prod/restore.sh "$(ls -d "$RUNNER_TEMP"/backups/*/ | tail -1)" --yes
          SMOKE_INSECURE=1 sh ops/prod/smoke.sh https://localhost:18443 pod-studio

      - name: Stack logs
        if: failure()
        run: docker compose -p pod-ci -f ops/prod/docker-compose.yml --env-file "$RUNNER_TEMP/prod.env" logs --no-color --tail 200
