function focusKey(el){if(!el||el===document.body)return null;if(el.id&&el.id!=='main')return '#'+el.id;for(const a of el.attributes){if(a.name.startsWith('data-')&&a.name!=='data-theme')return '['+a.name+'="'+CSS.escape(a.value)+'"]';}return null;}

function navigate(screen){state.screen=screen;clearTimeout(toastTimer);$('#toast').textContent='';render();window.scrollTo(0,0);$('#main').focus({preventScroll:true});}
let toastTimer;function toast(msg){$('#toast').textContent=msg;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').textContent='',4800);}
function modal(title,body,footer='',drawer=false){if(!$('#modal').open)opener=(lastButton&&document.contains(lastButton)&&!$('#modal').contains(lastButton))?lastButton:document.activeElement;$('#modal').className=drawer?'drawer':'';$('#modal').innerHTML='<header class="dialoghead"><h2 id="dialogTitle">'+title+'</h2><button data-close aria-label="Đóng hộp thoại">×</button></header>'+body+(footer?'<footer class="dialogfoot">'+footer+'</footer>':'');$('#modal').showModal();}
let opener=null;function closeModal(){ $('#modal').close(); }
$('#modal').addEventListener('close',()=>{setTimeout(()=>{if($('#modal').open)return;const k=focusKey(opener);const el=(opener&&document.contains(opener))?opener:(k&&document.querySelector(k));(el||$('#main')).focus({preventScroll:true});},0);});

er.isFinite(Number(x))||Number(x)<=0)||!state.title.trim()){state.dryRun=false;toast('Chưa hợp lệ: tiêu đề phải có nội dung và tất cả giá phải lớn hơn 0.');return;}state.dryRun=true;render();toast('Chạy thử DEMO thành công. Chưa gửi dữ liệu ra ngoài.');},push:()=>{if(!state.dryRun){toast('Hãy chạy thử trước khi đẩy hoặc gửi yêu cầu.');return;}state.jobs.push({id:Date.now(),name:canPush()?'Đẩy bản nháp DEMO':'Yêu cầu người có quyền đẩy bản nháp',store:state.store,status:'Chờ xử lý'});toast(canPush()?'Đã thêm bản nháp vào hàng đợi DEMO.':'Đã tạo yêu cầu đẩy DEMO cho người có quyền.');},confirmPublish:()=>{if(!$('#confirmPublish').checked){toast('Vui lòng xác nhận đã kiểm tra nội dung, giá và cửa hàng.');return;}if(!state.dryRun||!canPublish()){closeModal();toast('Quyền hoặc kết quả chạy thử đã thay đổi. Hãy kiểm tra lại.');return;}state.published=true;closeModal();render();toast('Xuất bản giả lập thành công. Shopify không thay đổi.');},createInvite:()=>{if(!$('#inviteForm').reportValidity())return;let email=$('#inviteEmail').value,role=$('#inviteRole').value;state.invites.push({email,role,store:state.store});closeModal();render();modal('Lời mời DEMO đã tạo','<p>Lời mời dành cho <b>'+esc(email)+'</b>. Không có email thật được gửi.</p><label style="margin-top:20px">Liên kết minh họa<input readonly value="https://example.invalid/invite/demo-only" onclick="this.select()"></label><div class="subtle" style="margin-top:18px">Đây là địa chỉ dành riêng cho minh họa, không mở được quy trình đăng ký thật. Hết hạn minh họa: sau 7 ngày.</div>','<button data-close>Hoàn tất</button>');},refreshHealth:()=>toast('Đã làm mới trạng thái giả lập. Thời gian nghỉ 00:42 chỉ để minh họa.'),relogged:()=>{state.relogged=true;render();toast('Đã ghi nhận. Worker sẽ báo trạng thái sẵn sàng sau khi kiểm tra phiên (DEMO).');},saveSkill:()=>{state.skillSaved=true;closeModal();toast('Đã lưu bản nháp chỉ dẫn trong DEMO, chưa phát hành kỹ năng.');}};
let lastButton=null;document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;lastButton=b;if(b.hasAttribute('data-close'))return closeModal();if(b.dataset.nav)return navigate(b.dataset.nav);if(b.dataset.theme!==undefined){state.theme=b.dataset.theme;document.body.className=state.theme==='light'?'':state.theme;$$('[data-theme]').forEach(x=>x.setAttribute('aria-pressed',x===b));render();return;}if(b.dataset.filter){state.filter=b.dataset.filter;render();return;}if(b.dataset.review!==undefined)return setReview(Number(b.dataset.review));if(b.dataset.store!==undefined)return selectStore(b.dataset.store);if(b.dataset.listtab){state.listingTab=b.dataset.listtab;render();return;}if(b.dataset.skilltab){state.skillTab=b.dataset.skilltab;render();return;}if(b.dataset.canceljob){state.jobs.find(j=>j.id===Number(b.dataset.canceljob)).status='Đã hủy';closeModal();queue();return;}if(b.dataset.skill!==undefined){let s=skills[Number(b.dataset.skill)];modal(s[1],'<div class="row"><span class="badge grey">'+s[3]+'</span><small>Bản nháp DEMO</small></div><label style="margin-top:22px">Chỉ dẫn<textarea style="min-height:200px">Bạn là người biên tập cho cửa hàng. Dựa trên thiết kế và phân tích, tạo đầu ra phù hợp với phong cách thương hiệu. Giữ đúng dữ kiện được cung cấp. Không suy đoán chất liệu, bản quyền hay thời gian vận chuyển. Đánh dấu điều cần xác nhận trước khi xuất bản.</textarea></label><p class="choice-note" style="margin-top:15px">Chỉ lưu bản nháp trong phiên xem. Phát hành kỹ năng cần quyền riêng của quản trị viên.</p>','<button data-close>Đóng</button><button class="primary" data-action="saveSkill">Lưu bản nháp DEMO</button>',true);return;}if(b.dataset.provider!==undefined){modal('Chi tiết nhà cung cấp DEMO','<div class="stack"><p>Tác vụ: '+['Tạo mẫu mô phỏng','Biên tập listing','Phân tích thiết kế'][Number(b.dataset.provider)]+'</p><p>Tài khoản: tài khoản mẫu đã được quản trị viên cấu hình.</p><p>Gặp lỗi hoặc cần nghỉ: giữ tác vụ trong hàng đợi v const FIT=[['clarity','Rõ ý khi nhìn nhanh'],['gift','Hợp làm quà'],['emotion','Sức gợi cảm xúc'],['diff','Khác biệt'],['series','Làm được thành bộ'],['ip','An toàn IP và nhãn hiệu']];
state.nicheEditor={step:0,status:'curated-draft',maxColors:7,built:0,scores:{clarity:5,gift:4,emotion:4,diff:4,series:4,ip:5},counts:{'data_provenance.sources':2,personas:8,buyer_recipient_pairs:5,occasions:6,emotions:6,buyer_language:7,'visual_vocabulary.motifs':12,'visual_vocabulary.palettes':3,'visual_vocabulary.typography':3,'visual_vocabulary.compositions':4,product_fit:5,personalization_fields:4,hook_patterns:8,sample_briefs:4,style_variants:4,'ip_safety.niche_specific_avoid':9,'ip_safety.safe_substitutions':3,'ip_safety.human_review_triggers':3}};
function nicheErrors(){const n=state.nicheEditor,e=[];NICHE_SECTIONS.forEach(s=>s[3].forEach(([p,,min,exact])=>{const c=n.counts[p];if(exact&&c!==min)e.push([p,'requires exactly '+min+' records; found '+c,s[2]]);else if(!exact&&c<min)e.push([p,'requires at least '+min+' records; found '+c,s[2]]);}));const m=Number(n.maxColors);if(!Number.isInteger(m)||m<1||m>12)e.push(['qa_rules.max_colors','expected an integer from 1 to 12',4]);return e;}
function fitVerdict(sc){const t=FIT.reduce((a,[k])=>a+Number(sc[k]),0);if(Number(sc.ip)<4)return[t,'Chặn: điểm IP dưới 4/5','red'];if(t>=25)return[t,'Làm','']; if(t>=21)return[t,'Chỉnh','amber'];if(t>=16)return[t,'Làm lại','amber'];return[t,'Thay','red'];}
function nicheField(p,label,min,exact){const c=state.nicheEditor.counts[p],ok=exact?c===min:c>=min,pct=Math.min(100,Math.round(c/min*100));return '<div class="nfield"><div class="row"><b>'+label+'</b><span class="badge '+(ok?'':'red')+'" data-count="'+p+'">'+c+' / '+(exact?'đúng ':'tối thiểu ')+min+'</span></div><div class="progress"><i style="width:'+pct+'%"></i></div><p class="meta">Ví dụ: '+esc((NICHE_SAMPLES[p]||[]).join(' • '))+'</p><button class="small" data-nadd="'+p+'" '+(exact&&c>=min?'disabled':'')+'>+ Thêm bản ghi DEMO</button>'+(exact?'<p class="meta">Cần đúng '+min+' variant: sửa hoặc thay, không thêm.</p>':'')+'</div>';}
function nicheSection(s){const n=state.nicheEditor,[id,title,,fields]=s;let body='';
if(id==='basics')body='<div class="nkv"><span>niche</span><code>teacher-gifts</code><span>niche_display</span><code>Quà tặng giáo viên</code><span>locale</span><code>en-US</code><span>schema_version</span><code>2.0</code></div>';
else if(id==='niche_profile')body='<p class="meta">6 ô bắt buộc: audience_summary, primary_buyers, primary_recipients, identity_signals, niche_boundaries, excluded_segments.</p><span class="badge">6/6 đã điền</span>';
else if(id==='data_provenance')body='<label for="nicheStatus">Trạng thái dữ liệu</label><select id="nicheStatus">'+[['curated-draft','Bản nháp tuyển chọn (curated-draft)'],['researched','Đã nghiên cứu (researched)'],['validated','Đã kiểm chứng (validated)']].map(([v,l])=>'<option value="'+v+'"'+(n.status===v?' selected':'')+'>'+l+'</option>').join('')+'</select><p class="meta">Ghi vào manifest để người dùng skill biết độ tin cậy của dữ liệu.</p>'+fields.map(f=>nicheField(...f)).join('');
else if(id==='market_fit_calibration'){const[t,v,c]=fitVerdict(n.scores);body='<p class="meta">Chấm thử một idea. Mỗi tiêu chí 1 đến 5, tối đa 30 điểm.</p><div class="scoregrid">'+FIT.map(([k,l])=>'<label>'+l+'<select data-score="'+k+'">'+[1,2,3,4,5].map(x=>'<option'+(Number(n.scores[k])===x?' selected':'')+'>'+x+'</option>').join('')+'</select></label>').join('')+'</div><div class="row" style="margin-top:14px"><b id="fitTotal">'+t+'/30</b><span class="badge '+c+'" id="fitVerdict">'+v+'</span></div><p class="meta" id="fitRules">Ngưỡng cố định theo generator: 25 trở lên làm, 21 chỉnh, 16 làm lại, 15 trở xuống thay. Điểm IP dưới 4/5 luôn chặn.</p>';}
else if(id==='qa_rules'){const m=Number(n.maxColors),bad=!Number.isInteger(m)||m<1||m>12;body='<ul class="nqa"><li>Nền <code>#00FF00</code>, dành riêng để tách nền</li><li>Tỉ lệ <code>3:4</code></li><li>Giữ đúng chữ: bắt buộc</li><li>Đầu ra: <code>isolated artwork</code></li><li>Bảng màu không được chứa <code>#00FF00</code></li></ul><label for="nicheMaxColors">Số màu tối đa</label><input id="nicheMaxColors" type="number" min="1" max="12" value="'+esc(n.maxColors)+'">'+(bad?'<p class="nerrline">qa_rules.max_colors: expected an integer from 1 to 12</p>':'');}
else body=fields.map(f=>nicheField(...f)).join('');
return '<section class="panel nsection" data-section="'+id+'"><h3>'+title+'</h3>'+body+'</section>';}
function nichePage(){const n=state.nicheEditor,errs=nicheErrors(),step=n.step;
return head('Dữ liệu ngách','Soạn master data, build skill.','Niche Quà tặng giáo viên • schema 2.0 • nguồn của niche agent.','<span class="badge grey">Bản nháp v3 DEMO</span>')+
'<div class="notice"><span style="font-size:17px" aria-hidden="true">◎</span><p>Thư viện skill <b>dùng chung toàn công ty</b>. Người có <code>skill.edit</code> soạn bản nháp; chỉ người có <code>skill.publish</code> mới publish. Mỗi job ghi <code>skill_version_id</code>.</p></div>'+
'<div class="nsteps" role="list">'+NICHE_STEPS.map((t,i)=>{const b=errs.filter(e=>e[2]===i).length;return '<button role="listitem" data-nstep="'+i+'" '+(i===step?'aria-current="step"':'')+'><small>Bước '+(i+1)+'</small><span>'+t+'</span>'+(b?'<span class="badge red">'+b+' lỗi</span>':'<span class="badge">Đạt</span>')+'</button>';}).join('')+'</div>'+
'<div class="nsec">'+NICHE_SECTIONS.filter(s=>s[2]===step).map(nicheSection).join('')+'</div>'+
'<section class="panel nresult"><div class="panelhead"><h2>Kết quả validator</h2><span class="badge '+(errs.length?'red':'')+'">'+(errs.length?errs.length+' lỗi':'Hợp lệ')+'</span></div>'+(errs.length?'<ul class="nerrs">'+errs.map(([p,m,s])=>'<li><code>- '+p+': '+m+'</code><button class="small" data-nfix="'+p+'" data-fixstep="'+s+'">Sửa</button></li>').join('')+'</ul>':'<p class="meta">Không còn lỗi. Build sẽ validate lại bằng generator trước khi đóng gói.</p>')+(n.built?'<p class="nbuilt" tabindex="-1" role="status">Đã build skill version v3 DEMO: validate, render, đóng gói. Chưa publish.</p>':'')+'</section>'+
'<div class="nbar" id="nicheBar"><span class="meta">Bước '+(step+1)+'/5 • '+(errs.length?errs.length+' lỗi chặn build':'Sẵn sàng build')+'</span><div class="nbtns"><button data-nprev '+(step===0?'disabled':'')+'>← Bước trước</button><button data-nnext '+(step===4?'disabled':'')+'>Bước sau →</button><button class="primary" data-nbuild '+(errs.length?'disabled':'')+'>Build skill version</button></div></div>';}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||state.screen!=='niche'||b.disabled)return;const n=state.nicheEditor;
if(b.dataset.nstep!==undefined){n.step=Number(b.dataset.nstep);render();return;}
if(b.hasAttribute('data-nprev')){n.step=Math.max(0,n.step-1);render();return;}
if(b.hasAttribute('data-nnext')){n.step=Math.min(4,n.step+1);render();return;}
if(b.dataset.nfix){n.step=Number(b.dataset.fixstep);render();const t=document.querySelector('[data-nadd="'+CSS.escape(b.dataset.nfix)+'"]')||document.querySelector('#nicheMaxColors');if(t)t.focus();return;}
if(b.dataset.nadd){n.counts[b.dataset.nadd]++;n.built=0;render();return;}
if(b.hasAttribute('data-nbuild')){n.built=1;render();document.querySelector('.nbuilt').focus();}});
document.addEventListener('change',e=>{const t=e.target;if(state.screen!=='niche')return;const n=state.nicheEditor;
if(t.dataset.score){n.scores[t.dataset.score]=Number(t.value);render();}
if(t.id==='nicheStatus'){n.status=t.value;render();}
if(t.id==='nicheMaxColors'){n.maxColors=t.value;n.built=0;render();}});
</script>
</body></html>
