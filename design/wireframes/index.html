<script>
'use strict';
const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];
const state={screen:'studio',store:0,filter:'all',search:'',selected:new Set(),review:0,statuses:['Pending review','Pending review','Approved','Pending review','Approved','Pending review'],listingTab:'content',skillTab:'templates',actor:'owner',delegated:false,pushDelegated:true,dryRun:false,published:false,generated:false,analysis:false,jobs:[],invites:[],uploaded:[],variant:['24.00','32.00','46.00'],title:'Garden print',description:'A tropical garden art print with deep greens on warm paper. Materials and shipping details need seller confirmation.',skillSaved:false,theme:'light'};
const stores=[{name:'Oak & Cloud',owner:'Alex Morgan',letter:'o',domain:'oakcloud.demo'},{name:'Sunday Paper',owner:'Alex Morgan',letter:'s',domain:'sundaypaper.demo'},{name:'Sunny Studio',owner:'Taylor Reed',letter:'s',domain:'sunnystudio.demo'}];
const designs=[{name:'Green space',kind:'botanical',code:'BOT-024',niche:'Botanical',date:'2026-10-01 09:42'},{name:'June sun',kind:'sun',code:'GEO-018',niche:'Geometric',date:'2026-10-01 09:15'},{name:'Wave rhythm',kind:'wave',code:'ABS-032',niche:'Abstract',date:'2026-09-30 16:30'},{name:'Garden leaves',kind:'leaf',code:'BOT-025',niche:'Botanical',date:'2026-09-30 15:20'},{name:'Windows',kind:'arch',code:'GEO-019',niche:'Geometric',date:'2026-09-30 14:08'},{name:'Quiet day',kind:'moon',code:'ABS-033',niche:'Abstract',date:'2026-09-30 11:45'}];
const icons=['<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>','<rect x="4" y="3" width="16" height="18" rx="3"/><path d="m8 12 3 3 6-6"/>','<path d="M5 3h10l4 4v14H5zM9 11h6M9 15h6M9 7h3"/>','<path d="m3 7 9-4 9 4-9 4zM3 7v11l9 4 9-4V7M12 11v11"/>','<path d="M3 10h18M4 10v11h16V10M2 10l3-7h14l3 7M9 21v-7h6v7"/>','<path d="m12 2 2 7 7 3-7 2-2 8-2-8-8-2 8-3z"/>','<path d="M4 5h16M4 12h10M4 19h7"/><circle cx="18" cy="17" r="3"/>'];
const navs=[['studio','Design library'],['review','Design review'],['listing','Listing content'],['products','Products & push'],['team','Stores & members'],['skills','Skills & operations'],['niche','Niche data']];
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function botanical(){return '<g fill="none" stroke="#355f47" stroke-width="3"><path d="M145 230Q168 160 138 71M142 219Q93 158 98 116M150 192Q211 168 215 111M144 139Q186 111 176 69"/></g><g fill="#53765a"><ellipse cx="132" cy="84" rx="15" ry="35" transform="rotate(-25 132 84)"/><ellipse cx="162" cy="125" rx="15" ry="31" transform="rotate(38 162 125)"/><ellipse cx="114" cy="154" rx="16" ry="35" transform="rotate(-47 114 154)"/><ellipse cx="94" cy="113" rx="13" ry="28" transform="rotate(-20 94 113)"/><ellipse cx="184" cy="173" rx="14" ry="31" transform="rotate(56 184 173)"/><ellipse cx="211" cy="124" rx="14" ry="30" transform="rotate(21 211 124)"/><ellipse cx="177" cy="72" rx="13" ry="28" transform="rotate(-14 177 72)"/></g><g fill="#91a180"><ellipse cx="143" cy="168" rx="11" ry="29" transform="rotate(-12 143 168)"/><ellipse cx="178" cy="103" rx="12" ry="25" transform="rotate(45 178 103)"/></g>';}
function artwork(kind='botanical',mock=false){let art='';if(kind==='botanical'||kind==='leaf'){art=botanical();if(kind==='leaf')art='<g transform="translate(296 12) scale(-.95 .95)">'+art+'</g><circle cx="72" cy="68" r="22" fill="#dca46f" opacity=".7"/>';}if(kind==='sun')art='<circle cx="150" cy="112" r="68" fill="#bc6244"/><path d="M60 159h180v65H60z" fill="#dfac6b"/><path d="M60 158h180M60 172h180M60 186h180M60 200h180M60 214h180" stroke="#f3e6cf" stroke-width="4"/>';if(kind==='wave')art='<path d="M30 220C70 20 130 30 150 158S236 218 270 60" stroke="#476975" stroke-width="43" fill="none"/><path d="M30 227C70 27 130 37 150 165S236 225 270 67" stroke="#f1dcb8" stroke-width="3" fill="none"/><circle cx="214" cy="57" r="18" fill="#bd7852"/>';if(kind==='arch')art='<path d="M57 231V107a56 56 0 0 1 112 0v124z" fill="#b77355"/><path d="M112 231V130a56 56 0 0 1 112 0v101z" fill="#d9b27b"/><path d="M136 231V132a31 31 0 0 1 62 0v99z" fill="#f3e8d8"/><path d="M57 231h168" stroke="#384f46" stroke-width="5"/>';if(kind==='moon')art='<circle cx="151" cy="111" r="66" fill="#cd9d65"/><circle cx="178" cy="89" r="54" fill="#f2e9d8"/><path d="m40 224 73-78 53 48 39-43 55 73z" fill="#5d7469"/><path d="m40 224 65-29 81 29" fill="#90a08c"/>';
let poster='<rect width="300" height="320" fill="#f2e9d8"/>'+art+'<text x="150" y="273" text-anchor="middle" font-family="Georgia,serif" font-size="13" letter-spacing="3" fill="#3c4f40">'+(kind==='botanical'?'Green space':kind==='sun'?'June sun':kind==='wave'?'Wave rhythm':kind==='leaf'?'Garden leaves':kind==='arch'?'Windows':'Quiet day')+'</text><text x="150" y="292" text-anchor="middle" font-family="Arial,sans-serif" font-size="5" letter-spacing="2" fill="#6f7567">Oak & Cloud • Collection 2026</text>';
return '<svg viewBox="0 0 400 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="'+(mock?'Wall art mockup':'Art illustration')+' '+esc(kind)+'">'+(mock?'<rect width="400" height="360" fill="#e4e1d5"/><path d="M0 0h70v360H0z" fill="#d8d8cb"/><path d="M0 292h400v68H0z" fill="#c3b5a0"/><path d="M69 0h5v292h-5z" fill="#cacdbf"/><path d="m81 315 237-12 42 35H97z" fill="#b0a48f" opacity=".5"/><rect x="109" y="31" width="198" height="250" fill="#9c8d78" opacity=".25"/><rect x="98" y="25" width="198" height="250" rx="1" fill="#887057"/><rect x="104" y="31" width="186" height="238" fill="#faf7ee"/><svg x="117" y="42" width="160" height="213" viewBox="0 0 300 320">'+poster+'</svg><path d="M325 277h34l-4 35h-26z" fill="#8d6e57"/><path d="M342 279q-30-27-10-49 20 22 10 49M342 267q8-37 25-35 1 25-25 35" fill="#5b7257"/><path d="M28 309h48v17H28z" fill="#ddd7c7"/><path d="M24 300h55v9H24z" fill="#738579"/>':'<rect width="400" height="360" fill="'+({botanical:'#e1e5d9',sun:'#ead9c4',wave:'#d8e1df',leaf:'#e1e5d5',arch:'#e8d9cd',moon:'#dce0da'}[kind]||'#e1e5d9')+'"/><rect x="81" y="20" width="245" height="325" rx="1" fill="#000" opacity=".06"/><svg x="73" y="16" width="248" height="320" viewBox="0 0 300 320">'+poster+'</svg>')+'</svg>';}
function badge(status){return '<span class="badge '+(status==='Pending review'?'amber':status==='Rejected'?'red':'')+'">'+status+'</span>';}
function head(kicker,title,subtitle,actions=''){return '<header class="pagehead"><div><div class="eyebrow">'+kicker+'</div><h1>'+title+'</h1><p>'+subtitle+'</p></div><div class="actions">'+actions+'</div></header>';}
function flow(active){return '<div class="flow"><span>Design</span><span>'+(active==='review'?'<b>Review</b>':'Review')+'</span><span>'+(active==='listing'?'<b>Content</b>':'Content')+'</span><span>'+(active==='products'?'<b>Products</b>':'Products')+'</span></div>';}
function nav(){ $('#nav').innerHTML=navs.map(([id,label],i)=>'<button data-nav="'+id+'" '+(state.screen===id?'aria-current="page"':'')+'><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">'+icons[i]+'</svg><span>'+label+'</span>'+(id==='review'?'<span class="count">'+state.statuses.filter(x=>x==='Pending review').length+'</span>':'')+'</button>').join('');}
function studio(){let list=designs.map((d,i)=>({...d,i})).filter(d=>(state.filter==='all'||state.filter==='approved'&&state.statuses[d.i]==='Approved'||state.filter==='pending'&&state.statuses[d.i]==='Pending review')&&d.name.toLocaleLowerCase('en').includes(state.search.toLocaleLowerCase('en')));return head('Design workspace','Organize designs and mockups.','Manage designs, create mockups and choose what to publish.','<button data-action="queue">Queue <span class="badge grey">'+state.jobs.length+'</span></button><button class="primary" data-action="upload">+ Upload designs</button>')+'<div class="notice"><span style="font-size:17px" aria-hidden="true">◎</span><p>Viewing designs for <b>'+stores[state.store].name+'</b>. Designs are scoped to each store; the skill library is shared company-wide.</p></div><div class="row"><div><h2>Store designs <span class="muted" style="font-size:12px;font-weight:400">/ 06 DEMO designs</span></h2></div><button class="ghost small" data-nav="review">Open review queue →</button></div><div class="toolbar"><div class="pills" aria-label="Filter designs"><button data-filter="all" aria-pressed="'+(state.filter==='all')+'">All</button><button data-filter="pending" aria-pressed="'+(state.filter==='pending')+'">Pending review</button><button data-filter="approved" aria-pressed="'+(state.filter==='approved')+'">Approved</button></div><input id="search" class="search" type="search" placeholder="Search designs..." aria-label="Search designs" value="'+esc(state.search)+'"></div>'+(state.selected.size?'<div class="notice row"><span>Selected designs: '+state.selected.size+'</span><button class="small primary" data-action="mockup">Create mockups</button></div>':'')+'<div class="grid" id="designGrid">'+(list.length?list.map(d=>'<article class="designcard"><div class="art">'+artwork(d.kind,d.i%3===1)+'<label class="cardcheck"><input type="checkbox" data-select="'+d.i+'" aria-label="Select '+d.name+'" '+(state.selected.has(d.i)?'checked':'')+'></label><span class="badge grey artbadge">'+d.niche+'</span><button class="cardopen" data-review="'+d.i+'" aria-label="Review '+d.name+'">↗</button></div><div class="cardmeta"><div><h3>'+d.name+'</h3><p>'+d.code+' • '+d.date+'</p></div>'+badge(state.statuses[d.i])+'</div></article>').join(''):'<div class="empty">No designs found. Try another name.</div>')+'</div>'+(state.uploaded.length?'<div class="panel" style="margin-top:20px"><h3>Files selected in DEMO</h3><p>'+state.uploaded.map(esc).join(', ')+'</p><small>Only file names are stored in memory. Nothing is uploaded.</small></div>':'');}
function review(){let d=designs[state.review];return flow('review')+head('Design review',d.name,'Compare the original and mockup before creating content.','<button class="small" data-nav="studio">← Library</button>'+badge(state.statuses[state.review]))+'<div class="split"><section><div class="reviewpair"><div><div class="caption"><span>Original</span><span>3000 × 4000 px</span></div><div class="art">'+artwork(d.kind)+'</div></div><div><div class="caption"><span>Mockup</span><span>Living room • 01</span></div><div class="art">'+artwork(d.kind,true)+'</div></div></div><div class="thumbs" aria-label="Choose design">'+designs.map((x,i)=>'<button data-review="'+i+'" aria-label="Select '+x.name+'" aria-pressed="'+(i===state.review)+'">'+artwork(x.kind)+'</button>').join('')+'</div></section><aside class="panel"><div class="eyebrow">Review checklist</div><h2 style="margin-top:10px">Check against the original.</h2><div class="divider"></div><div class="stack"><label class="checkline"><input type="checkbox" checked> Layout and proportions match</label><label class="checkline"><input type="checkbox" checked> Colors are consistent</label><label class="checkline"><input type="checkbox" checked> No extra details</label></div><div class="divider"></div><p class="choice-note">These checkboxes support manual review. DEMO does not validate images automatically.</p><div class="subtle" style="margin-top:22px"><b>'+d.code+' / Mockup 01</b><p>Oak frame, natural light. Skill: Interior mockup v1.2.</p></div><button style="width:100%;margin-top:18px" data-action="mockup">Create another mockup</button><p class="reviewresult" id="reviewResult" style="margin-top:14px">'+(state.statuses[state.review]==='Pending review'?'Ready for review.':'DEMO result: '+state.statuses[state.review])+'</p></aside></div><div class="reviewcontrols"><div class="keyboard"><b>'+(state.review+1)+' / 6</b> &nbsp; <kbd>←</kbd> <kbd>→</kbd> switch mockup &nbsp; <kbd>A</kbd> approve &nbsp; <kbd>R</kbd> reject</div><div class="actions"><button data-action="prev" aria-label="Previous design">←</button><button data-action="next" aria-label="Next design">→</button><button class="danger" data-action="reject">Reject</button><button class="primary" data-action="approve">Approve</button><button class="ghost small" data-nav="listing">Create content →</button></div></div>';}
function listing(){let d=designs[state.review];return flow('listing')+head('Product editor','Create listing content.','Write listing copy for the selected design on '+stores[state.store].name+'.','<button data-action="saveListing">Save draft</button><button '+(state.generated?'class="primary" ':'')+'data-nav="products">Prepare product →</button>')+'<div class="split"><section class="panel"><div class="tabs" role="tablist" aria-label="Listing editor"><button role="tab" data-listtab="content" aria-selected="'+(state.listingTab==='content')+'">Content</button><button role="tab" data-listtab="analysis" aria-selected="'+(state.listingTab==='analysis')+'">Design analysis</button></div>'+(state.listingTab==='content'?'<div class="fieldgrid"><label>Language<select id="language"><option>Vietnamese</option><option>English</option></select></label><label>Tone<select id="tone"><option>Warm, minimal</option> <option>Clear, practical</option></select></label><label class="full">Content skill<select><option>Art storytelling • v1.3</option><option>Short description • v1.0</option></select></label></div><div class="row" style="margin:22px 0"><small>Input: '+d.code+' + design analysis</small><button class="'+(state.generated?'':'primary ')+'small" data-action="generate">'+(state.generated?'✦ Regenerate DEMO':'✦ Generate DEMO content')+'</button></div><div class="divider"></div><div class="stack"><label>Product title<input id="listingTitle" maxlength="120" value="'+esc(state.title)+'"></label><label>Description<textarea id="listingDescription">'+esc(state.description)+'</textarea></label><label>Keywords<input value="botanical print, home decor, minimal" id="tags"></label></div><p class="choice-note" style="margin-top:16px">'+(state.generated?'DEMO suggestion created. Edit it before saving.':'Sample content for layout review. No AI service is called.')+'</p>':'<div class="eyebrow">'+d.code+' • Sample result</div><h2 style="margin:10px 0 18px">Review the image before writing.</h2><div class="statline"><span class="number">01</span><div><h3>Subject & audience</h3><p>Art style: '+d.niche.toLowerCase()+'. Suggested for calm interiors and minimal workspaces.</p></div></div><div class="statline"><span class="number">02</span><div><h3>Visual style</h3><p>Warm cream background, open layout, green and earth tones. Keep descriptions factual and avoid unverified material claims.</p></div></div><div class="statline"><span class="number">03</span><div><h3>Seller confirmation needed</h3><p>Print material, actual size, copyright and shipping times are unverified.</p></div></div><button class="primary" data-action="analyze" style="margin-top:22px">'+(state.analysis?'Rerun DEMO analysis':'Run DEMO analysis')+'</button><p style="font-size:11px;margin-top:12px">'+(state.analysis?'Simulation complete. No real image analysis was performed.':'Suggested analysis does not replace copyright checks.')+'</p>')+'</section><aside><div class="panel"><div class="panelhead"><h3>Listing preview</h3><span class="badge grey">Draft</span></div><div class="listingpreview"><div class="art">'+artwork(d.kind,true)+'</div><div class="eyebrow" style="margin-top:22px">'+stores[state.store].name+'</div><h2 id="previewTitle">'+esc(state.title)+'</h2><p id="previewDescription">'+esc(state.description)+'</p><div style="margin-top:18px;font-weight:600">From $24.00</div></div><p class="choice-note" style="margin-top:16px">Content preview only, not the actual Shopify storefront.</p></div></aside></div>';}
function canPush(){return state.store===0&&(state.actor==='owner'||state.actor==='delegate'&&state.pushDelegated)||state.store===1&&state.actor==='owner';}
function canPublish(){return state.store===0&&(state.actor==='owner'||state.actor==='delegate'&&state.delegated)||state.store===1&&state.actor==='owner';}
function products(){return flow('products')+head('Products & push','Check content and permissions.','Changes apply only to this browser DEMO session.','<span class="badge '+(state.published?'':'amber')+'">'+(state.published?'Published in simulation':'Not sent to Shopify')+'</span>')+'<div class="split"><section class="stack"><div class="panel"><div class="row"><div class="cellperson"><div class="inline-art">'+artwork(designs[state.review].kind,true)+'</div><div><h2>'+esc(state.title)+'</h2><p style="font-size:12px;margin-top:5px">Art print • '+stores[state.store].name+' • 3 variants</p></div></div></div><div class="divider"></div><div class="tablewrap"><table><caption class="hidden">DEMO product variants</caption><thead><tr><th>Variant</th><th>SKU</th><th>Price (USD)</th><th>Check</th></tr></thead><tbody>'+['21 × 30 cm','30 × 40 cm','50 × 70 cm'].map((x,i)=>'<tr><td>'+x+'<br><small>Art paper</small></td><td>OC-BOT24-'+['S','M','L'][i]+'</td><td><input aria-label="Variant price '+(i+1)+'" type="number" min="1" step="0.01" data-price="'+i+'" value="'+state.variant[i]+'"></td><td><span class="badge">Valid</span></td></tr>').join('')+'</tbody></table></div></div><div class="panel"><h3>Dry-run results</h3>'+(state.dryRun?'<div class="timeline"><div><b><span class="dot"></span>Product data is valid</b><p>Checked 3 variants, title and prices.</p></div><div><b><span class="dot"></span>'+stores[state.store].name+' is selected</b><p>DEMO destination. No real Shopify connection.</p></div><div><b><span class="dot"></span>Permissions are rechecked on confirmation</b><p>A dry run does not grant push or publish permission.</p></div></div>':'<p style="margin-top:12px">Run a dry run to find data errors before requesting a push or publishing. No external changes are made.</p>')+'<button style="margin-top:14px" data-action="dryrun">'+(state.dryRun?'Rerun dry run':'Run dry run')+'</button></div></section><aside class="panel"><div class="eyebrow">Final step</div><h2 style="margin:10px 0 document.addEventListener('change',e=>{let t=e.target;if(t.id==='storeSelect')selectStore(t.value);if(t.dataset.select!==undefined){let i=Number(t.dataset.select);t.checked?state.selected.add(i):state.selected.delete(i);render();}if(t.id==='actor'){state.actor=t.value;render();}if(t.id==='delegatePublish'){state.delegated=t.checked;toast(t.checked?'Store owner granted Casey Lee publish permission in DEMO.':'Casey Lee DEMO publish permission revoked.');}if(t.id==='delegatePush'){state.pushDelegated=t.checked;toast('DEMO draft push permission updated separately.');}if(t.dataset.price!==undefined){state.variant[Number(t.dataset.price)]=t.value;state.dryRun=false;state.published=false;render();}});
document.addEventListener('input',e=>{let t=e.target;if(t.id==='search'){let start=t.selectionStart;state.search=t.value;render();$('#search').focus();try{$('#search').setSelectionRange(start,start)}catch{}}if(t.id==='listingTitle'){state.title=t.value;state.dryRun=false;$('#previewTitle').textContent=t.value;}if(t.id==='listingDescription'){state.description=t.value;state.dryRun=false;$('#previewDescription').textContent=t.value;}if(t.id==='rejectReason')t.setCustomValidity('');});
document.addEventListener('keydown',e=>{if(state.screen!=='review'||$('#modal').open||e.ctrlKey||e.metaKey||e.altKey||e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'){e.preventDefault();setReview(state.review-1);}if(e.key==='ArrowRight'){e.preventDefault();setReview(state.review+1);}if(e.key.toLowerCase()==='a'){e.preventDefault();approve();}if(e.key.toLowerCase()==='r'){e.preventDefault();reject();}});
render();
const NICHE_STEPS=['Buyers','Occasions and emotions','Images and products','Hooks, briefs and scoring','Style, IP and QA'];
const NICHE_SECTIONS=[['basics','Basic information',0,[]],['niche_profile','Niche profile',0,[]],['data_provenance','Data sources',0,[['data_provenance.sources','Source',1]]],['personas','Persona',0,[['personas','Persona',8]]],['buyer_recipient_pairs','Buyer and recipient pairs',0,[['buyer_recipient_pairs','Pair',5]]],['occasions','Buying occasions',1,[['occasions','Occasion',8]]],['emotions','Emotions',1,[['emotions','Emotions',6]]],['buyer_language','Buyer language',1,[['buyer_language','Phrase',6]]],['visual_vocabulary','Visual vocabulary',2,[['visual_vocabulary.motifs','Motif',10],['visual_vocabulary.palettes','Color palette',3],['visual_vocabulary.typography','Typography',3],['visual_vocabulary.compositions','Layout',4]]],['product_fit','Product fit',2,[['product_fit','Products',5]]],['personalization_fields','Personalization fields',2,[['personalization_fields','Field',4]]],['hook_patterns','Hook templates',3,[['hook_patterns','Hook',8]]],['sample_briefs','Sample briefs',3,[['sample_briefs','Brief',6]]],['market_fit_calibration','Market-fit scoring',3,[]],['style_variants','Style variant',4,[['style_variants','Variant',4,true]]],['ip_safety','IP safety',4,[['ip_safety.niche_specific_avoid','Avoid',5],['ip_safety.safe_substitutions','Safe alternatives',3],['ip_safety.human_review_triggers','Human review flags',3]]],['qa_rules','QA rules',4,[]]];
const NICHE_SAMPLES={'data_provenance.sources':['Etsy: 40 bestselling listings','Interviews with 6 parents'],personas:['Parents gifting preschool teachers','Graduating students gifting a homeroom teacher','Colleagues gifting a retiring teacher'],buyer_recipient_pairs:['Parent → teacher','Class → homeroom teacher','Principal → new teacher'],occasions:['Teacher appreciation day','End of school year','Retirement'],emotions:['Gratitude','Pride','Humor'],buyer_language:['thank you teacher','best teacher ever','end of year gift'],'visual_vocabulary.motifs':['Apple','Pencil','Blackboard'],'visual_vocabulary.palettes':['Chalk white and board green','Warm apple red','Classroom pastels'],'visual_vocabulary.typography':['Handwritten','Classic serif','Rounded block letters'],'visual_vocabulary.compositions':['Round badge','Stacked text','Arch frame','Vertical layout'],product_fit:['11 oz ceramic mug','Tote bag','T-shirt'],personalization_fields:['Teacher name','Subject taught','School year'],hook_patterns:['[Name] teaches with heart','Patience level: unlimited','Class of [school year] thanks you'],sample_briefs:['Retirement mug for a preschool teacher','Year-end tote for a math teacher','Class gift T-shirt for a homeroom teacher'],style_variants:['Clear at small sizes','Warm handmade','Playful typography','Premium minimal'],'ip_safety.niche_specific_avoid':['School logos and seals','Copyrighted picture-book characters','Trademarked education program names'],'ip_safety.safe_substitutions':['School logo → original apple badge','Copyrighted character → original animal','Song lyric → original phrase'],'ip_safety.human_review_triggers':['Real school name','Resembles a copyrighted character','Long quotation']};
const FIT=[['clarity','Clear at a glance'],['gift','Gift appeal'],['emotion','Emotional impact'],['diff','Distinctiveness'],['series','Collection potential'],['ip','IP and trademark safety']];
state.nicheEditor={step:0,status:'curated-draft',maxColors:7,built:0,scores:{clarity:5,gift:4,emotion:4,diff:4,series:4,ip:5},counts:{'data_provenance.sources':2,personas:8,buyer_recipient_pairs:5,occasions:6,emotions:6,buyer_language:7,'visual_vocabulary.motifs':12,'visual_vocabulary.palettes':3,'visual_vocabulary.typography':3,'visual_vocabulary.compositions':4,product_fit:5,personalization_fields:4,hook_patterns:8,sample_briefs:4,style_variants:4,'ip_safety.niche_specific_avoid':9,'ip_safety.safe_substitutions':3,'ip_safety.human_review_triggers':3}};
function nicheErrors(){const n=state.nicheEditor,e=[];NICHE_SECTIONS.forEach(s=>s[3].forEach(([p,,min,exact])=>{const c=n.counts[p];if(exact&&c!==min)e.push([p,'requires exactly '+min+' records; found '+c,s[2]]);else if(!exact&&c<min)e.push([p,'requires at least '+min+' records; found '+c,s[2]]);}));const m=Number(n.maxColors);if(!Number.isInteger(m)||m<1||m>12)e.push(['qa_rules.max_colors','expected an integer from 1 to 12',4]);return e;}
function fitVerdict(sc){const t=FIT.reduce((a,[k])=>a+Number(sc[k]),0);if(Number(sc.ip)<4)return[t,'Blocked: IP score below 4/5','red'];if(t>=25)return[t,'Produce','']; if(t>=21)return[t,'Revise','amber'];if(t>=16)return[t,'Rework','amber'];return[t,'Replace','red'];}
function nicheField(p,label,min,exact){const c=state.nicheEditor.counts[p],ok=exact?c===min:c>=min,pct=Math.min(100,Math.round(c/min*100));return '<div class="nfield"><div class="row"><b>'+label+'</b><span class="badge '+(ok?'':'red')+'" data-count="'+p+'">'+c+' / '+(exact?'exactly ':'minimum ')+min+'</span></div><div class="progress"><i style="width:'+pct+'%"></i></div><p class="meta">Example: '+esc((NICHE_SAMPLES[p]||[]).join(' • '))+'</p><button class="small" data-nadd="'+p+'" '+(exact&&c>=min?'disabled':'')+'>+ Add DEMO record</button>'+(exact?'<p class="meta">Requires exactly '+min+' variants: edit or replace, do not add.</p>':'')+'</div>';}
function nicheSection(s){const n=state.nicheEditor,[id,title,,fields]=s;let body='';
if(id==='basics')body='<div class="nkv"><span>niche</span><code>teacher-gifts</code><span>niche_display</span><code>Teacher gifts</code><span>locale</span><code>en-US</code><span>schema_version</span><code>2.0</code></div>';
else if(id==='niche_profile')body='<p class="meta">6 required fields: audience_summary, primary_buyers, primary_recipients, identity_signals, niche_boundaries, excluded_segments.</p><span class="badge">6/6 filled</span>';
else if(id==='data_provenance')body='<label for="nicheStatus">Data status</label><select id="nicheStatus">'+[['curated-draft','Curated draft (curated-draft)'],['researched','Researched (researched)'],['validated','Validated (validated)']].map(([v,l])=>'<option value="'+v+'"'+(n.status===v?' selected':'')+'>'+l+'</option>').join('')+'</select><p class="meta">Stored in the manifest so skill users can assess data reliability.</p>'+fields.map(f=>nicheField(...f)).join('');
else if(id==='market_fit_calibration'){const[t,v,c]=fitVerdict(n.scores);body='<p class="meta">Score an idea. Each criterion is 1 to 5, up to 30 points.</p><div class="scoregrid">'+FIT.map(([k,l])=>'<label>'+l+'<select data-score="'+k+'">'+[1,2,3,4,5].map(x=>'<option'+(Number(n.scores[k])===x?' selected':'')+'>'+x+'</option>').join('')+'</select></label>').join('')+'</div><div class="row" style="margin-top:14px"><b id="fitTotal">'+t+'/30</b><span class="badge '+c+'" id="fitVerdict">'+v+'</span></div><p class="meta" id="fitRules">Fixed generator thresholds: 25+ produce, 21 revise, 16 rework, 15 or less replace. An IP score below 4/5 always blocks production.</p>';}
else if(id==='qa_rules'){const m=Number(n.maxColors),bad=!Number.isInteger(m)||m<1||m>12;body='<ul class="nqa"><li>Background <code>#00FF00</code>, reserved for background removal</li><li>Aspect ratio <code>3:4</code></li><li>Exact text: required</li><li>Output: <code>isolated artwork</code></li><li>Palette must not contain <code>#00FF00</code></li></ul><label for="nicheMaxColors">Maximum colors</label><input id="nicheMaxColors" type="number" min="1" max="12" value="'+esc(n.maxColors)+'">'+(bad?'<p class="nerrline">qa_rules.max_colors: expected an integer from 1 to 12</p>':'');}
else body=fields.map(f=>nicheField(...f)).join('');
return '<section class="panel nsection" data-section="'+id+'"><h3>'+title+'</h3>'+body+'</section>';}
function nichePage(){const n=state.nicheEditor,errs=nicheErrors(),step=n.step;
return head('Niche data','Edit master data, build skills.','Teacher gifts niche • schema 2.0 • source for the niche agent.','<span class="badge grey">DEMO draft v3</span>')+
'<div class="notice"><span style="font-size:17px" aria-hidden="true">◎</span><p>Skill library <b>shared company-wide</b>. Users with <code>skill.edit</code> can edit drafts; only users with <code>skill.publish</code> can publish. Each job records <code>skill_version_id</code>.</p></div>'+
'<div class="nsteps" role="list">'+NICHE_STEPS.map((t,i)=>{const b=errs.filter(e=>e[2]===i).length;return '<button role="listitem" data-nstep="'+i+'" '+(i===step?'aria-current="step"':'')+'><small>Step '+(i+1)+'</small><span>'+t+'</span>'+(b?'<span class="badge red">'+b+(b===1?' error':' errors')+'</span>':'<span class="badge">Valid</span>')+'</button>';}).join('')+'</div>'+
'<div class="nsecwrap"><div class="nsec" data-nsec-step="'+step+'">'+NICHE_SECTIONS.filter(s=>s[2]===step).map(nicheSection).join('')+'</div></div>'+
'<section class="panel nresult"><div class="panelhead"><h2>Validator results</h2><span class="badge '+(errs.length?'red':'')+'">'+(errs.length?errs.length+(errs.length===1?' error':' errors'):'Valid')+'</span></div>'+(errs.length?'<ul class="nerrs">'+errs.map(([p,m,s])=>'<li><code>- '+p+': '+m+'</code><button class="small" data-nfix="'+p+'" data-fixstep="'+s+'">Fix</button></li>').join('')+'</ul>':'<p class="meta">No errors. The generator will validate again before packaging.</p>')+(n.built?'<p class="nbuilt" tabindex="-1" role="status">DEMO skill version v3 built: validated, rendered and packaged. Not published.</p>':'')+'</section>'+
'<div class="nbar" id="nicheBar"><span class="meta">Step '+(step+1)+'/5 • '+(errs.length?'Build blocked by errors: '+errs.length:'Ready to build')+'</span><div class="nbtns"><button data-nprev '+(step===0?'disabled':'')+'>← Previous step</button><button data-nnext '+(step===4?'disabled':'')+'>Next step →</button><button class="primary" data-nbuild '+(errs.length?'disabled':'')+'>Build skill version</button></div></div>';}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||state.screen!=='niche'||b.disabled)return;const n=state.nicheEditor;
if(b.dataset.nstep!==undefined){n.step=Number(b.dataset.nstep);render();return;}
if(b.hasAttribute('data-nprev')){n.step=Math.max(0,n.step-1);render();return;}
if(b.hasAttribute('data-nnext')){n.step=Math.min(4,n.step+1);render();return;}
if(b.dataset.nfix){n.step=Number(b.dataset.fixstep);render();const t=document.querySelector('[data-nadd="'+CSS.escape(b.dataset.nfix)+'"]')||document.querySelector('#nicheMaxColors');if(t)t.focus();return;}
if(b.dataset.nadd){n.counts[b.dataset.nadd]++;n.built=0;render();return;}
if(b.hasAttribute('data-nbuild')){n.built=1;render();document.querySelector('.nbuilt').focus();}});
document.addEventListener('change',e=>{const t=e.target;if(state.screen!=='niche')return;const n=state.nicheEditor;
if(t.dataset.score){n.scores[t.dataset.score]=Number(t.value);render();}
if(t.id==='nicheStatus'){n.status=t.value;render();}
if(t.id==='nicheMaxColors'){n.maxColors=t.value;n.built=0;render();}});
</script>
</body></html>
